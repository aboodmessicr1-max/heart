<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glowing Pink Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    let angle = 0;
    let pulseTime = 0;
    const NUM_STEPS = 85;
    const TEXT = "I love you";
    
    // Dynamic sizing variables
    let baseScale = 22;
    let bFontSize = 110;
    let textFontSize = 18;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Calculate scale according to the smaller dimension (width or height)
      const minDimension = Math.min(canvas.width, canvas.height);
      
      // Auto-scale elements so it never overflows on small screens
      baseScale = minDimension / 22;      // Scales outer heart shape
      bFontSize = minDimension * 0.22;    // Scales center 'B' font
      textFontSize = minDimension * 0.038; // Scales perimeter text font
    }
    resize();

    function heartX(t) { 
      return 16 * Math.pow(Math.sin(t), 3); 
    }
    
    function heartY(t) { 
      return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); 
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Slowed-down heartbeat pulse rhythm
      const pulse = 1 + 0.1 * Math.pow(Math.sin(pulseTime), 63) + 0.04 * Math.sin(pulseTime * 2);
      const currentScale = baseScale * pulse;

      // --- 1. Scaled Center "B" ---
      ctx.save();
      ctx.font = `bold ${bFontSize}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      ctx.shadowColor = "#ff2a8d";
      ctx.shadowBlur = bFontSize * 0.25;
      
      ctx.fillStyle = "#ffffff";
      ctx.fillText("B", cx, cy);
      ctx.restore();

      // --- 2. Scaled "I love you" Text ---
      ctx.font = `bold ${Math.max(10, textFontSize)}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const pinkColor = "#ff3388";

      for (let i = 0; i < NUM_STEPS; i++) {
        const t = (i / NUM_STEPS) * Math.PI * 2 + angle;
        
        const x = heartX(t) * currentScale;
        const y = -heartY(t) * currentScale;

        const posX = cx + x;
        const posY = cy + y;

        ctx.save();

        ctx.shadowColor = pinkColor;
        ctx.shadowBlur = 15;

        ctx.fillStyle = pinkColor;
        ctx.translate(posX, posY);
        ctx.fillText(TEXT, 0, 0);
        ctx.restore();
      }

      angle += 0.008;      // Smooth rotation
      pulseTime += 0.02;   // Slow pulse speed
      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    draw();
  </script>
</body>
</html>
