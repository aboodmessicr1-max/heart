<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Pink Heart with Slow Pulse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();

    let angle = 0;
    let pulseTime = 0;
    const NUM_STEPS = 90;     // Adjusted step count for optimal spacing
    const BASE_SCALE = 22;    // Heart outer scale
    const TEXT = "I love you";

    function heartX(t) { 
      return 16 * Math.pow(Math.sin(t), 3); 
    }
    
    function heartY(t) { 
      return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); 
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Slowed-down heartbeat pulse rhythm
      const pulse = 1 + 0.12 * Math.pow(Math.sin(pulseTime), 63) + 0.05 * Math.sin(pulseTime * 2);
      const currentScale = BASE_SCALE * pulse;

      // --- 1. Large Center "B" ---
      ctx.save();
      ctx.font = "bold 110px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      ctx.shadowColor = "#ff2a8d";
      ctx.shadowBlur = 30;
      
      ctx.fillStyle = "#ffffff";
      ctx.fillText("B", cx, cy);
      ctx.restore();

      // --- 2. "I love you" Text (Pink & Glowing) ---
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const pinkColor = "#ff3388"; // Vibrant bright pink color

      for (let i = 0; i < NUM_STEPS; i++) {
        const t = (i / NUM_STEPS) * Math.PI * 2 + angle;
        
        const x = heartX(t) * currentScale;
        const y = -heartY(t) * currentScale;

        const posX = cx + x;
        const posY = cy + y;

        ctx.save();

        // Strong pink neon glow
        ctx.shadowColor = pinkColor;
        ctx.shadowBlur = 20;

        ctx.fillStyle = pinkColor;
        ctx.translate(posX, posY);
        ctx.fillText(TEXT, 0, 0);
        ctx.restore();
      }

      angle += 0.008;      // Smooth rotation speed
      pulseTime += 0.02;   // Slow pulse speed (reduced from 0.04)
      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    draw();
  </script>
</body>
</html>
